[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tainted-cli"
version = "0.1.2"
description = "Tainted local developer loop — analyze / watch / fix / pre-commit gate."
requires-python = ">=3.11"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Tainted" }]
# The core engine, pinned exactly: a surface and the engine it wraps are cut from one commit
# and released under one number, so a range here would let pip assemble a pair that was never
# tested together. `tests/test_release_shape.py` fails the release if this drifts from
# `tainted.__version__`.
dependencies = [
    "tainted==0.1.2",
    "typer>=0.12",
    "rich>=13.0",
    "watchdog>=4.0",
]

[project.scripts]
tainted = "tainted_cli.main:app"
tainted-gate = "tainted_cli.hooks:gate"

[tool.setuptools.packages.find]
include = ["tainted_cli*"]
