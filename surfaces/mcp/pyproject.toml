[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tainted-mcp"
version = "0.1.2"
description = "Tainted MCP server — analyze/prove/fix as tools for a coding agent."
requires-python = ">=3.11"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Tainted" }]
# The core engine, pinned exactly — see the note in `surfaces/cli/pyproject.toml`.
dependencies = [
    "tainted==0.1.2",
    "mcp>=2.0",
]

[project.scripts]
tainted-mcp = "tainted_mcp.server:main"

[tool.setuptools.packages.find]
include = ["tainted_mcp*"]
