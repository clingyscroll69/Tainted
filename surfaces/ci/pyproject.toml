[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tainted-ci"
version = "0.2.0"
description = "Tainted CI runner — analyze + prove against a preview deploy, gate the pipeline."
requires-python = ">=3.11"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Tainted" }]
# The core engine, pinned exactly — see the note in `surfaces/cli/pyproject.toml`.
dependencies = [
    "tainted==0.2.0",
    "PyJWT>=2.8",  # OIDC signature verification against the provider JWKS
]

[project.scripts]
tainted-ci = "tainted_ci.entrypoint:main"

[tool.setuptools.packages.find]
include = ["tainted_ci*"]
