# Example consumer workflow. Drop into .github/workflows/ in the app repo.
name: Tainted
on: [pull_request]

permissions:
  contents: read        # `contents: write` as well, if you turn `fix` on below
  id-token: write        # required so the workflow can mint an OIDC token
  pull-requests: write   # for the job summary / PR comment

jobs:
  tainted:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Deploy your preview here (Vercel/Netlify/etc.) and capture its URL as PREVIEW_URL.
      # - id: preview
      #   run: echo "url=https://pr-${{ github.event.number }}.example.vercel.app" >> "$GITHUB_OUTPUT"

      - name: Mint OIDC token for ownership proof
        id: oidc
        run: |
          TOKEN=$(curl -s -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=tainted" | python -c 'import sys,json;print(json.load(sys.stdin)["value"])')
          echo "::add-mask::$TOKEN"
          echo "token=$TOKEN" >> "$GITHUB_OUTPUT"

      - name: Run Tainted
        # `your-org/tainted@v0` once published; `./` when the action lives in this same repo.
        # It is `./` and not `./surfaces/ci`, because a Docker action is built with the
        # directory holding its action.yml as the build context, and this one needs the repo
        # root — that is where the engine it installs lives.
        uses: your-org/tainted@v0
        env:
          TAINTED_OIDC_TOKEN: ${{ steps.oidc.outputs.token }}
        with:
          target-url: ${{ steps.preview.outputs.url }}
          anon-key: ${{ secrets.SUPABASE_ANON_KEY }}
          login-a: ${{ secrets.TAINTED_LOGIN_A }}
          login-b: ${{ secrets.TAINTED_LOGIN_B }}
          seed: ${{ vars.TAINTED_SEED }}
          fail-on: high
          # Every check runs by default except test_integrity. Narrow with `only`/`skip`, e.g.
          # only: bola,rls
          gemini-api-key: ${{ secrets.GEMINI_API_KEY }}
          # Opens one PR carrying the fixes for what this run proved. That PR's own run proves
          # them against its own preview. Needs `contents: write` above, and a token that can
          # push and start workflows.
          fix: "false"
          github-token: ${{ github.token }}
