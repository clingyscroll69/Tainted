[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tainted-website"
version = "0.1.0"
description = "Tainted demonstration website — FastAPI over the engine, cytoscape tool graph."
requires-python = ">=3.11"
# The core engine (`tainted`) is installed alongside from the same repo — see ../README.md.
# Install the core with its dynamic extra so `prove` can drive a browser: pip install -e ".[dynamic]"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "python-multipart>=0.0.9",
    "httpx>=0.27",          # GitHub OAuth token exchange + API + tarball fetch
    "cryptography>=42",     # AES-GCM for the sealed sign-in cookie (backend/session_token.py)
]

[project.scripts]
tainted-web = "backend.run:main"

[tool.setuptools.packages.find]
include = ["backend*"]

[tool.pytest.ini_options]
markers = [
    "measures_timing: asserts how long an operation takes, so it must not be sped up",
]
