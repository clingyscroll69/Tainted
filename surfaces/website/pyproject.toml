[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tainted-website"
version = "0.1.0"
description = "Tainted demonstration website — FastAPI over the engine, cytoscape tool graph."
requires-python = ">=3.11"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Tainted" }]
# The core engine (`tainted`) is installed alongside from the same repo — see ../README.md.
# Install the core with its dynamic extra so `prove` can drive a browser: pip install -e ".[dynamic]"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "python-multipart>=0.0.9",
    "httpx>=0.27",          # GitHub OAuth token exchange + API + tarball fetch
    "cryptography>=42",     # AES-GCM for the sealed sign-in cookie (backend/session_token.py)
]

[project.scripts]
tainted-web = "backend.run:main"

# `frontend` is listed here as well as `backend`, and it has to be. The whole page — 110 KB of
# index.html, the tour script, the five self-hosted faces and the graph library — is a sibling
# directory, not a Python package, so a wheel built from `include = ["backend*"]` alone contained
# the server and nothing it serves. That install answers 404 on `/`. It went unnoticed because
# every documented path is a source install (`pip install -e`) or the container, where the
# directory is simply there on disk; the moment anything builds a wheel, it is not.
#
# `namespaces = true` is what lets a directory with no `__init__.py` be collected, and
# `package-data` names the files, because a wheel ships no data by default.
[tool.setuptools.packages.find]
include = ["backend*", "frontend*"]
namespaces = true

[tool.setuptools.package-data]
frontend = ["*.html", "*.js", "*.css", "fonts/*", "vendor/*"]

[tool.pytest.ini_options]
markers = [
    "measures_timing: asserts how long an operation takes, so it must not be sped up",
]
