[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tainted"
version = "0.1.2"
description = "A security scanner for AI-written apps: finds where untrusted data reaches a dangerous place, proves it by attacking, and fixes it."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Tainted" }]

dependencies = [
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "python-dotenv>=1.0",
    "google-genai>=2.0",
    "httpx>=0.27",
    "networkx>=3.0",
    "sqlglot>=25.0",
    "tree-sitter>=0.21",
    "tree-sitter-language-pack>=0.2",
]

[project.optional-dependencies]
# Traffic discovery: walks the running app and captures the requests its own frontend makes,
# so an object reference is found wherever it sits. Optional — without it `prove` still fires
# every static candidate, it just cannot discover references the source never spells out.
dynamic = ["playwright>=1.40"]
# Interprocedural taint. Semgrep is heavy, so it is installed on demand; without it the
# per-handler route scan carries the request plane and the report says the taint pass was
# skipped rather than implying there was nothing to find.
semgrep = ["semgrep>=1.50"]
# Signature verification for CI OIDC ownership. Without it the claims are still checked and
# the result records that the signature was not independently verified.
oidc = ["pyjwt[crypto]>=2.8"]
# DNS TXT ownership verification for stable non-local targets.
dns = ["dnspython>=2.4"]
# Third-party validation of the injection generator (not of the detector).
bench = ["agentdojo>=0.1"]
dev = ["pytest>=8.0"]
all = [
    "playwright>=1.40",
    "semgrep>=1.50",
    "pyjwt[crypto]>=2.8",
    "dnspython>=2.4",
]
# Everything needed to run the four test suites and the linters in one install. The README's
# Tests section lists four commands; installing only `dev` leaves two of them failing at
# collection on a dependency the reader was never told to install.
dev-all = [
    "pytest>=8.0",
    "ruff>=0.6",
    "mypy>=1.11",
    # The deployment-contract tests read action.yml and .pre-commit-hooks.yaml. They are the
    # only thing in the suite that builds nothing and is still the only check on files whose
    # failure mode is "the published artifact does not run".
    "PyYAML>=6.0",
]

[tool.setuptools.packages.find]
include = ["tainted*"]

[tool.setuptools.package-data]
# The bundled Semgrep taint rules ship with the engine.
"tainted.static" = ["rules/*.yaml"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = [".venv", "tests/fixtures"]

[tool.ruff.lint]
# Deliberately narrow. The point of adopting a linter here is to catch the class of thing that
# had already gone unnoticed — an unused import, a name in an annotation that was never
# imported — not to restyle a codebase whose conventions are consistent and deliberate.
#
# `I` (import sorting) is left off for that reason: it wanted to reorder imports in 25 files,
# and this codebase groups them meaningfully (engine, then surface-local) in a way isort's
# alphabetisation would flatten. Turn it on with a dedicated commit if it is ever wanted.
select = ["F", "E9"]

[tool.mypy]
python_version = "3.11"
# Lenient on purpose: this codebase has never been type-checked, and a strict first pass would
# produce hundreds of findings nobody reads. What is switched on is the part that was actually
# broken — annotations referring to names that do not exist.
files = ["tainted"]
ignore_missing_imports = true
check_untyped_defs = false
disallow_untyped_defs = false
warn_unused_ignores = false

[tool.pytest.ini_options]
# No `asyncio_mode` here. It is a pytest-asyncio option, the suite contains no `async def`
# tests, and the plugin was not installed — so the key did nothing except emit a
# PytestConfigWarning on every run, which is exactly the noise that hides a real warning.
# Restore both together if an async test is ever added.
testpaths = ["tests"]
